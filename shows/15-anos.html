<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhony & Maura | 15 anos</title>
    
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../eventos.css">
</head>
<body>
    
    <!-----HERO----->
    <section class="evento-hero">
        <div class="evento-overlay"></div>
        <div class="evento-container">

            <span class="evento-tag">
                SHOW PREMIUM
            </span>

            <h1>
                Festa de 15 anos
            </h1>

            <p>
                Música, interação e emoção para transformar
                esse momento em uma lembrança inesquicível
            </p>

            <a href="#contato" class="evento-btn">
                Solicitar orçamento
            </a>

        </div>
    </section>

    <!---FOLDER---->

    <section class="folder-section">

        <div class="folder-container">
            
            <img 
                src="assests/eventos/15-anos/folder-15anos.png"
                alt="Folder oficial 15 anos">

        </div>
    </section>
    
    <!----CTA---->

    <section class="evento-cta" id="contato">
        <div class="container">
            <h2>
                Transforme seu sonho em realidade
            </h2>

            <p>
                Fale conosco e receba uma proposta personalizada
            </p>

            <a href="#" class="evento-btn">
                Falar no Whatapp
            </a>

        </div>
    </section>
</body>
</html>
