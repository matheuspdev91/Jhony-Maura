<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../eventos.css">
</head>
<body>

    <!----- HERO ----->
    <section class="evento-banner">

        <picture>

            <source
                media="(max-width: 768px)"
                srcset="../assets/eventos/15-anos/15-anos-mobile.png">

            <img
                src="../assets/eventos/15-anos/15-anos.png"
                alt="Show Premium - Festa de 15 anos"
                class="evento-banner-img">

        </picture>

        <a
            href="https://wa.me/5537SEUNUMERO"
            target="_blank"
            rel="noopener"
            class="evento-banner-btn banner-15anos"
            aria-label="Solicitar orçamento">

    <!----- EXPERIÊNCIA ----->
    <section class="evento-info">

        <picture>

            <source
                media="(max-width:768px)"
                srcset="../assets/eventos/15-anos/info-mobile.png">

            <img
                src="../assets/eventos/15-anos/info-desktop.png"
                alt="Como é a experiência Jhony & Maura em festas de 15 anos"
