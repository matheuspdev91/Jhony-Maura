<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhony & Maura | 15 anos</title>
    
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../eventos.css">
</head>
<body>
    
    <!-----HERO----->
    <section class="evento-hero">
        <div class="evento-overlay"></div>
        <div class="evento-container">

            <a href="#contato" class="evento-btn">
                Solicitar orçamento
            </a>

        </div>
    </section>

    <!---FOLDER---->

    <section class="folder-section">

        <div class="folder-container">
            
            <a href="../assets/eventos/15-anos/15-anos.png"
                target="_blank"
                class="folder-image">

                <img
                  src="../assets/eventos/15-anos/15-anos.png"
                  alt="Folder completo do show de 15 anos"
                  class="folder-image">

                <div class="folder-overlay">
                    <span>Clique para ampliar</span>
                </div>
            </a>   
        </div>
    </section>
    
    <!----CTA---->

    <section class="evento-cta" id="contato">
        <div class="container">
            <h2>
                Transforme seu sonho em realidade
            </h2>

            <p>
                Fale conosco e receba uma proposta personalizada
            </p>

            <a href="#" class="evento-btn">
                Falar no Whatapp
            </a>

        </div>
    </section>
</body>
</html>
